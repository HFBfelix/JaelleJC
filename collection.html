<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Collection | Jaelle & JC - Artisanat Français</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org/",
      "@type": "CollectionPage",
      "name": "Collection Jaelle & JC",
      "description": "Sacs cabas et accessoires bébé faits main en France en éditions limitées.",
      "brand": { "@type": "Brand", "name": "Jaelle & JC" }
    }
    </script>
</head>
<body>
    <header>
        <nav class="nav-luxe">
            <a href="index.html" class="nav-link">Accueil</a>
            <div class="logo-central">
                <img src="assets/logo fond noir.jpg" alt="Jaelle & JC" class="logo-img">
            </div>
            <a href="manifeste.html" class="nav-link">Le Manifeste</a>
        </nav>
    </header>

    <main>
        <section class="univers">
            <header class="univers-header">
                <h2 class="section-title">Maroquinerie</h2>
                <p class="section-subtitle">L'élégance du coton premium, façonné à la main.</p>
            </header>
            
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-image-container">
                        <img src="assets/hero-image.jpg" alt="Cabas Moutarde" class="product-img">
                        <img src="assets/JC blanc fond noir.png" alt="Sceau JC" class="badge-estampille">
                    </div>
                    <h3>Cabas 100% Coton Moutarde</h3>
                    <p class="description-courte">Imprimé fleurs blanches, série limitée.</p>
                    <button onclick="acquerirProduit('Cabas Moutarde', 'https://pay.sumup.io/b2c/votre-lien-1')" class="btn-acquerir">Acquérir</button>
                </div>
            </div>
        </section>

        <section class="univers">
            <header class="univers-header">
                <h2 class="section-title">L'Univers Bébé</h2>
                <p class="section-subtitle">Douceur et poésie pour les premiers instants.</p>
            </header>
            
            <div class="product-grid">
                <div class="product-card">
                    <div class="product-image-container">
                        <img src="assets/coffret-bebe.jpg" alt="Couverture Moutarde" class="product-img">
                        <img src="assets/JC blanc fond noir.png" alt="Sceau JC" class="badge-estampille">
                    </div>
                    <h3>Couverture Moutarde Fleurs</h3>
                    <p class="description-courte">Coton ultra-doux, bordures travaillées.</p>
                    <button onclick="acquerirProduit('Couverture Moutarde', 'https://pay.sumup.io/b2c/votre-lien-bebe')" class="btn-acquerir">Acquérir</button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
