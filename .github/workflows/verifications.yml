# Vérifications obligatoires avant fusion (SECURITE.md §2).
name: Vérifications

on:
  pull_request:
  push:
    branches: [refonte-next]

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Java : émulateurs Firestore et Authentication des tests de parcours (catalogue et comptes fictifs).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Construction
        run: npm run build
      - name: Dépendances (aucune faille élevée ou critique)
        run: npm audit --audit-level=high
      - name: Parcours (Playwright)
        run: |
          npx playwright install --with-deps chromium webkit firefox
          # Paiement : faux serveur Stripe des tests (tests/e2e/fake-stripe.ts), clés de test tirées au hasard
          # à chaque lancement (aucune vraie clé, rien n'est envoyé chez Stripe).
          export STRIPE_SECRET_KEY="sk_test_$(openssl rand -hex 16)"
          export STRIPE_WEBHOOK_SECRET="whsec_$(openssl rand -hex 24)"
          export STRIPE_API_HOST="127.0.0.1:12111"
          npx firebase emulators:exec --only firestore,auth --project demo-jaellejc "npm run test:e2e"
      # Les captures de référence sont prises sous Windows : la comparaison visuelle se lance en local
      # (npm run test:visual), le rendu des polices différant sous Linux.

  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Règles Firestore et Storage (émulateur)
        run: npm run test:rules

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Analyse des seuls nouveaux commits : l'historique contient d'anciennes clés Brevo déjà connues
      # (reports/suivi.md, à révoquer dans Brevo), qui bloqueraient sinon chaque vérification.
      - name: Détection de secrets (gitleaks)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Premier envoi d'une branche : pas de commit précédent, on part de main.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin main
            BASE=$(git merge-base origin/main HEAD)
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --redact --log-opts="${BASE}..HEAD"
